[project]
name = "psi-n-mono-back"
version = "1.0.7.2"
description = "Backend do projeto psi_n_mono"
readme = "README.rst"
requires-python = ">=3.9,<4.0"
authors = [{ name = "cesardddp", email = "cesardddp@hotmail.com" }]
license = { text = "GPL-3.0" }
dependencies = [
    "beautifulsoup4>=4.15.0",
    "flask==3",
    "flask-caching>=2.3.1",
    "flask-cors>=6.0.5",
    "gunicorn>=23.0.0,<24",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.4.0,<9",
    "ipdb>=0.13.9,<1",
    "pytest>=8.0.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = true
